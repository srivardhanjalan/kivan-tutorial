[pytest]
# Standalone rootdir for the live-stack harness, so `pytest tools/e2e` never
# picks up the backend unit suite's conftest (moto) and vice versa.
addopts = -ra
markers =
    e2e: live-stack end-to-end test (skipped unless E2E_API_URL is set)
    step11: step 11 notifications flow suite
    step12: step 12 email flow suite
    step13: step 13 events flow suite
    step14: step 14 sharing flow suite
    step15: step 15 admin flow suite
    step16: step 16 operations flow suite
    step17: step 17 media flow suite
