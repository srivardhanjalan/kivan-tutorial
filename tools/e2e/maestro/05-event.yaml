# 05 — Create an event (via the native date picker), then assert its detail screen.
#
# Visual components asserted: the event-detail cover band (the event name over
# the cover, plus the date/life-event GlassPill badges) and the segmented toggle
# between "Wishlists" and "Guests".
#
# The event date is set through the iOS inline calendar (a native control):
# tapping the "Event date" field opens it, and tapping a day number commits it.
# Selectors are RN accessibilityLabels matched as plain text (no testIDs exist).
appId: host.exp.Exponent
tags:
  - kivan-ui
---
- stopApp
- openLink: exp://localhost:8081
- extendedWaitUntil:
    visible: "My Stuff"            # tab-bar label
    timeout: 90000
# settle the JS thread after cold start so the first tap is not dropped
- waitForAnimationToEnd
- tapOn: "My Stuff"
- extendedWaitUntil:
    visible: "My Stuff"            # screen header (Wishlists section is above Events)
    timeout: 20000
# Events live below the Wishlists section — scroll the create affordance into
# view. It's "New Event" when you already host events, "Create an event" from the
# empty state; scroll to whichever exists, then tap it.
- scrollUntilVisible:
    element:
      text: "New Event"
    direction: DOWN
    timeout: 15000
    optional: true
- scrollUntilVisible:
    element:
      text: "Create an event"
    direction: DOWN
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: "New Event"
    commands:
      - tapOn: "New Event"
- runFlow:
    when:
      visible: "Create an event"
    commands:
      - tapOn: "Create an event"
# --- EventForm ---
- extendedWaitUntil:
    visible: "New Event"           # form title
    timeout: 20000
- tapOn: "Event name"
- inputText: "E2E Launch Party"
- hideKeyboard
- assertVisible: "Life event"
- tapOn: "Birthday"
# Open the native inline date picker (exercises the DatePickerField). Selecting a
# specific day is best-effort: the iOS inline UICalendarView day cells aren't
# reliably addressable by Maestro, so the day tap is optional — the event is
# still created (with a "TBD" date if no day registers), which is all the
# cover-band + segmented-toggle assertions below need. (Documented in README.)
- tapOn: "Event date"
- tapOn:
    text: "28"                     # a day in the current month (best-effort)
    optional: true
- tapOn:
    text: "Event date"             # collapse the inline calendar
    optional: true
- tapOn: "Create Event"
# Create navigates back to My Stuff with the new event in the Events list; open
# its detail to assert the cover band + segmented toggle.
- extendedWaitUntil:
    visible: "E2E Launch Party"    # the new event card in the My Stuff list
    timeout: 30000
- tapOn: "E2E Launch Party"
# --- EventDetail: cover band + segmented toggle ---
- extendedWaitUntil:
    visible: "E2E Launch Party"    # event name over the cover band
    timeout: 20000
- assertVisible: "Hosted by Vera Verify"   # under the cover band
- assertVisible: "Wishlists"       # segmented toggle segment
- assertVisible: "Guests"          # segmented toggle segment
- takeScreenshot: artifacts-gitignored/05-event-detail
