# 02 — Add a wish to an existing wishlist, then assert its masonry card + pill.
#
# Visual components asserted: the wish's masonry card (tile, matched by its
# accessibilityLabel = the wish name) and its glass price pill (the formatted
# "₹1,299" over the card).
#
# The wish form's image field opens the native iOS image picker — an OS control
# not reliably scriptable from Maestro here — so the wish is created without a
# photo; the two required visual assertions don't depend on the image (see the
# note by the save step + README). Targets a seeded wishlist ("Kitchen Upgrade").
# Selectors are RN accessibilityLabels matched as plain text (no testIDs exist).
appId: host.exp.Exponent
tags:
  - kivan-ui
---
- stopApp
- openLink: exp://localhost:8081
- extendedWaitUntil:
    visible: "My Stuff"            # tab-bar label
    timeout: 90000
# settle the JS thread after cold start so the first tap is not dropped
- waitForAnimationToEnd
- tapOn: "My Stuff"
- extendedWaitUntil:
    visible: "Kitchen Upgrade"     # a seeded wishlist tile
    timeout: 20000
- tapOn: "Kitchen Upgrade"
# --- WishlistDetail: open the wish form ---
- extendedWaitUntil:
    visible: "New Wish"            # the add-wish tile
    timeout: 20000
- tapOn: "New Wish"
# --- WishForm ---
- extendedWaitUntil:
    visible: "New Wish"            # form title
    timeout: 20000
- tapOn: "Wish name"
- inputText: "E2E Espresso Machine"
- hideKeyboard
- tapOn: "Cost (₹)"
- inputText: "1299"
# Dismiss the number pad by tapping a neutral label (iOS has no return key on the
# numeric keyboard, and the RN ScrollView dismisses on a tap outside any input).
- tapOn: "Wish image"
# NOTE on the photo: the image field opens the native iOS image picker
# (UIImagePickerController, allowsEditing) — an out-of-process OS control that is
# not reliably scriptable from Maestro in this environment. The two REQUIRED
# visual assertions below (masonry card + glass price pill) are independent of
# the image, so the flow creates the wish without one and asserts the components
# that are under test. (Documented in README.)
- tapOn: "Add Wish"                # save (pinned footer, keyboard now dismissed)
# --- Back in WishlistDetail: the masonry card (the new card lands at the end) ---
- scrollUntilVisible:
    element:
      text: "E2E Espresso Machine"    # the wish's masonry card (tile accessibilityLabel)
    direction: DOWN
    timeout: 20000
- assertVisible: "E2E Espresso Machine"
# The masonry screenshot is the visual record of the glass price pill: the pill's
# text ("₹1,299") is a child of the card's single accessibility element (the card
# carries accessibilityLabel = the wish name), so on the list it is not an
# independently addressable node — it IS captured in this screenshot, and its
# value is asserted below on the wish detail, where the price is a standalone Text.
- takeScreenshot: artifacts-gitignored/02-wish-add-masonry
# --- Wish detail: the glass price pill's value, addressable here ---
- tapOn: "E2E Espresso Machine"
- extendedWaitUntil:
    visible: "₹1,299"                 # the price (the glass pill's value)
    timeout: 15000
- assertVisible: "₹1,299"
- takeScreenshot: artifacts-gitignored/02-wish-add-detail
