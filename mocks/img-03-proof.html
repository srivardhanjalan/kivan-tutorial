<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  body{background:transparent;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    width:900px;box-sizing:border-box;padding:40px;overflow:hidden}
  .row{display:flex;gap:56px;justify-content:center;align-items:flex-start}
  .item{display:flex;flex-direction:column;align-items:center;width:340px}
  .phone{width:340px;height:250px;border-radius:26px;overflow:hidden;background:#fff;
    box-shadow:0 22px 50px rgba(20,20,30,.20);border:1px solid #e6e6ea}
  .phone img{display:block;width:340px}
  .cap{margin-top:16px;font-size:15px;font-weight:700;letter-spacing:-.2px}
  .cap.up{color:#1a8917}.cap.down{color:#d1384f}
  .sub{margin-top:3px;font-size:13px;color:#8a90a0;font-weight:600;text-align:center;max-width:300px}
</style></head><body>
  <div class="row">
    <div class="item">
      <div class="phone"><img src="shot-03-healthy.png"></div>
      <div class="cap up">Backend &#183; healthy</div>
      <div class="sub">the API answers /health on localhost</div>
    </div>
    <div class="item">
      <div class="phone"><img src="shot-03-unreachable.png"></div>
      <div class="cap down">Backend &#183; unreachable</div>
      <div class="sub">fresh checkout, no .env.local yet: the line names the missing var</div>
    </div>
  </div>
</body></html>
